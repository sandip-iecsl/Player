workflows:
  ios-workflow:
    name: 🍎 Aura Player iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.auraplayer
      vars:
        BUNDLE_ID: "com.yourcompany.auraplayer"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...) # Add your encrypted value
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...) # Add your encrypted value
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...) # Add your encrypted value
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 🔧 Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: 📦 Get Flutter packages
        script: |
          flutter packages pub get
      - name: 🔍 Flutter analyze
        script: |
          flutter analyze
      - name: 🧪 Flutter unit tests
        script: |
          flutter test
        ignore_failure: true
      - name: 🏗️ Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your-email@example.com # Replace with your email
        notify:
          success: true
          failure: false
      app_store_connect:
        auth: integration
        # Configuration for App Store Connect publishing
        submit_to_testflight: true
        beta_groups: # Specify the names of beta tester groups that will get access to the build once it has passed beta review.
          - group name 1
          - group name 2
        submit_to_app_store: false