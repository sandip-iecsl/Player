name: aura_player
description: "Aura Player - Ad-Free Music Streaming for Gen-Z"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Audio Playback
  audio_service: ^0.18.10
  just_audio: ^0.9.34

  # API & HTTP
  dio: ^5.3.1

  # File Management
  path_provider: ^2.1.5

  # UI & Animations
  lottie: ^2.4.0
  sliding_up_panel: ^2.0.0+1
  palette_generator: ^0.3.3+2

  # Code Generation
  freezed_annotation: ^2.4.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  torch_light: ^1.0.0
  nearby_connections: ^4.3.0
  url_launcher: ^6.3.0
  fftea: ^1.5.0+1
  permission_handler: ^12.0.1
  encrypt: 5.0.3
  record: ^6.2.0
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  firebase_messaging: 16.3.0
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^18.0.0
  connectivity_plus: ^7.1.1
  file_picker: 11.0.2
  excel: ^4.0.6
  csv: ^8.0.0
  scrollable_positioned_list: ^0.3.8


  flutter_native_splash: ^2.4.4
  pointycastle: any
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#121212"
  image: "assets/images/app_icon.png"
  android: true
  android_12:
    color: "#121212"
    image: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/logo/
