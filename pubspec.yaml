name: aura_player
description: "Aura Player - Ad-Free Music Streaming for Gen-Z"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Audio Playback
  audio_service: ^0.18.10
  just_audio: ^0.9.34

  # API & HTTP
  dio: ^5.3.1

  # File Management
  path_provider: ^2.1.5

  # UI & Animations
  lottie: ^2.4.0
  sliding_up_panel: ^2.0.0+1
  palette_generator: ^0.3.3+2

  # Code Generation
  freezed_annotation: ^2.4.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  torch_light: ^1.0.0
  nearby_connections: ^4.3.0
  url_launcher: ^6.3.0
  fftea: ^1.5.0+1
  permission_handler: ^12.0.1
  encrypt: 5.0.3
  record: ^6.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/logo/
