name: 🍎 Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build_ios:
    name: 🔨 Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install dependencies
      run: flutter pub get
      
    - name: 🔍 Analyze code
      run: flutter analyze --fatal-infos
      
    - name: 🧪 Run tests
      run: flutter test
      
    - name: 🛠️ Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 🔨 Build iOS (Debug)
      if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
      run: |
        flutter build ios --debug --no-codesign
        echo "✅ Debug build completed successfully!"
        
    # Release build with code signing (requires secrets)
    - name: 🔐 Import Code-Signing Certificates
      if: github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main'
      uses: Apple-Actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.IOS_DIST_SIGNING_KEY }}
        p12-password: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
    
    - name: 📱 Download Provisioning Profiles
      if: github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main'
      uses: Apple-Actions/download-provisioning-profiles@v1
      with:
        bundle-id: 'com.yourcompany.auraplayer'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    
    - name: 🏗️ Build Release IPA
      if: github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main'
      run: |
        flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
        echo "✅ Release IPA build completed!"
    
    - name: 📤 Upload IPA to Artifacts
      if: github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: aura-player-ios-${{ github.run_number }}
        path: build/ios/ipa/*.ipa
        retention-days: 30
    
    - name: 🚀 Upload to TestFlight (Optional)
      if: github.event.inputs.build_type == 'release' && github.ref == 'refs/heads/main'
      uses: Apple-Actions/upload-testflight-build@v1
      with:
        app-path: build/ios/ipa/aura_player.ipa
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        
    - name: 📊 Build Summary
      run: |
        echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **App Name:** Aura Player" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version:** 3.24.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          echo "- **IPA Location:** build/ios/ipa/aura_player.ipa" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** Check Artifacts section below" >> $GITHUB_STEP_SUMMARY
        fi